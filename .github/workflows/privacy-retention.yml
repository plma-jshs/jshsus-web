name: Privacy retention

on:
  schedule:
    # 04:30 KST every day, after the database backup.
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply approved erasure policies instead of dry-run
        required: true
        type: boolean
        default: false

concurrency:
  group: production-privacy-retention
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  retain:
    name: Approved retention policies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: privacy-operations
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      DATABASE_URL: ${{ secrets.PRIVACY_DATABASE_URL }}
      DATABASE_SSL_MODE: ${{ vars.DATABASE_SSL_MODE || 'required' }}
    steps:
      - name: Validate protected configuration
        shell: bash
        env:
          ROLE_ARN: ${{ vars.AWS_OPERATIONS_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
          [[ "$COGNITO_USER_POOL_ID" =~ ^ap-northeast-2_[A-Za-z0-9]+$ ]]
          [[ "$DATABASE_SSL_MODE" == 'required' ]]
          test -n "$DATABASE_URL"

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@10.30.0

      - name: Install retention dependencies
        run: pnpm install --frozen-lockfile --filter @jshsus/db...

      - name: Assume the privacy operations role
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 1800
          role-to-assume: ${{ vars.AWS_OPERATIONS_ROLE_ARN }}
          role-session-name: jshsus-privacy-${{ github.run_id }}

      - name: Execute retention
        shell: bash
        env:
          DISPATCH_APPLY: ${{ inputs.apply }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'schedule' || "$DISPATCH_APPLY" == 'true' ]]; then
            node packages/db/scripts/privacy-retention.cjs \
              --apply \
              --confirm-policy owner-confirmed-2026-07-31
          else
            node packages/db/scripts/privacy-retention.cjs
          fi
