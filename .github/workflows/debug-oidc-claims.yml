name: Debug OIDC claims

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    environment: database-backup
    steps:
      - name: Read non-sensitive OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')"
          test -n "$token"
          OIDC_TOKEN="$token" python3 - <<'PY'
          import base64
          import json
          import os

          encoded = os.environ["OIDC_TOKEN"].split(".")[1]
          encoded += "=" * (-len(encoded) % 4)
          claims = json.loads(base64.urlsafe_b64decode(encoded))
          print(json.dumps({
              key: claims.get(key)
              for key in ("aud", "sub", "repository", "environment", "ref")
          }, indent=2, sort_keys=True))
          PY
